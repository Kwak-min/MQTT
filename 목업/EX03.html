<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>센서 에너지 비교 · 대시보드 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: light;
  --bg: #f2f4f8; --surface: #ffffff; --ink: #111c33; --ink2: #55607a; --ink3: #8a93a8; --line: #e1e5ee;
  --gb: #e08a00; --gb-soft: #fff3dc; --mq: #3d4fd1; --mq-soft: #e9ecff;
  --ok: #1f9d6b; --ok-soft: #e2f6ee; --off: #8a93a8; --off-soft: #eceff5; --warn: #c0392b;
  --font: "Noto Sans KR", "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
  --num: "Outfit", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, p { margin: 0; }
button { font-family: inherit; font-size: inherit; color: inherit; }
:focus-visible { outline: 3px solid #8fa0ff; outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
header.top h1 { font-size: 17px; font-weight: 700; }
header.top p { font-size: 12px; color: var(--ink3); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--off-soft); color: var(--ink2); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.pill.ok { background: var(--ok-soft); color: #14724e; }
.pill.ok i { background: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .pill.ok i { animation: blink 2s ease-in-out infinite; } }
@keyframes blink { 50% { opacity: .3; } }
main { padding: 24px 0 64px; display: flex; flex-direction: column; gap: 20px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.card > .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card h2 { font-size: 16px; font-weight: 700; }
.hint { font-size: 13px; color: var(--ink2); }

/* 핵심 비교 */
.hero { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; gap: 20px; } }
.saving .big { font-family: var(--num); font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -0.03em; }
.saving .big small { font-size: 32px; font-weight: 600; margin-left: 2px; }
.saving .cap { font-size: 15px; font-weight: 700; margin-top: 8px; }
.saving .sub { font-size: 13px; color: var(--ink2); margin-top: 4px; }
.race { display: flex; flex-direction: column; gap: 18px; }
.race .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
.race .nm { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; }
.race .val { font-family: var(--num); font-size: 22px; font-weight: 600; }
.race .val small { font-size: 13px; font-weight: 500; color: var(--ink3); margin-left: 3px; }
.track { height: 16px; background: var(--bg); border-radius: 8px; overflow: hidden; }
.fill { height: 100%; border-radius: 8px; transition: width 400ms ease; }
.race .tot { font-size: 12px; color: var(--ink3); margin-top: 5px; }

/* 스위치 */
.switch { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; cursor: pointer; font-size: 13px; color: var(--ink2); }
.switch .box { width: 38px; height: 22px; border-radius: 999px; background: #c8cfdd; position: relative; transition: background 150ms; flex: none; }
.switch .box::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 150ms; }
.switch[aria-checked="true"] .box { background: var(--ok); }
.switch[aria-checked="true"] .box::after { transform: translateX(16px); }

/* 차트 */
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { font-family: var(--num); color: var(--ink); font-weight: 600; }
.empty { padding: 56px 0; text-align: center; color: var(--ink3); font-size: 14px; }

/* 보드 카드 */
.devices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .devices { grid-template-columns: 1fr; } }
.dev { border: 1px solid var(--line); border-radius: 12px; padding: 18px; border-top-width: 4px; }
.dev .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
.dev .nm { font-weight: 700; }
.reads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.read .k { font-size: 12px; color: var(--ink3); }
.read .v { font-family: var(--num); font-size: 26px; font-weight: 600; line-height: 1.2; }
.read .v small { font-size: 13px; font-weight: 500; color: var(--ink3); margin-left: 2px; }
.dev .more { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.flag { color: var(--warn); font-weight: 500; }

/* 제어 */
.ctl-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctl-row + .ctl-row { margin-top: 16px; }
.ctl-row .lbl { font-size: 14px; font-weight: 500; min-width: 84px; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 16px; border-radius: 8px; cursor: pointer; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(17,28,51,.15); }
.seg button:disabled { opacity: .5; cursor: wait; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--ink3); }
.btn:disabled { opacity: .5; cursor: wait; }
.btn.danger { color: var(--warn); }
.msg { margin-top: 14px; min-height: 22px; font-size: 13px; color: var(--ok); }

details { margin-top: 4px; }
summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; display: flex; align-items: center; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "펼치기"; font-size: 13px; font-weight: 400; color: var(--ink2); }
details[open] summary::after { content: "접기"; }
.tabs { display: flex; gap: 8px; margin: 14px 0 10px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.tabs button[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
pre { margin: 0; background: var(--ink); color: #dfe6ff; padding: 14px; border-radius: 10px; font-size: 12.5px; line-height: 1.6; overflow: auto; max-height: 240px; }
.mock { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 4px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div>
      <h1>센서 에너지 비교</h1>
      <p>Gingerbread와 Standard MQTT, 통신 한 번에 얼마나 쓸까?</p>
    </div>
    <span class="pill" id="conn"><i></i><span></span></span>
  </div>
</header>

<main class="wrap">
  <section class="card" aria-labelledby="h-compare">
    <div class="head"><h2 id="h-compare">한눈에 비교</h2><span class="pill" id="exp"><i></i><span></span></span></div>
    <div class="hero">
      <div class="saving" id="saving"></div>
      <div class="race" id="race"></div>
    </div>
  </section>

  <section class="card" aria-labelledby="h-trend">
    <div class="head">
      <div><h2 id="h-trend">통신 에너지 변화</h2><p class="hint">한 번 통신할 때 쓴 에너지 (낮을수록 좋아요)</p></div>
      <button class="switch" id="spike" role="switch" aria-checked="true" title="처음 Wi-Fi에 연결할 때 생기는 튀는 값을 그래프에서 뺍니다"><span class="box"></span><span>튀는 값 빼고 보기</span></button>
    </div>
    <div class="chart" id="trend"></div>
  </section>

  <section class="card" aria-labelledby="h-dev">
    <div class="head"><h2 id="h-dev">지금 보드 상태</h2><p class="hint">2초마다 갱신돼요</p></div>
    <div class="devices" id="devices"></div>
  </section>

  <section class="card" aria-labelledby="h-ctl">
    <div class="head"><h2 id="h-ctl">실험 설정</h2></div>
    <div class="ctl-row"><span class="lbl">전송 주기</span><div class="seg" id="intervals" role="group" aria-label="전송 주기"></div></div>
    <div class="ctl-row">
      <span class="lbl">데이터</span>
      <button class="btn" id="csvGb"><span class="sw" style="background:var(--gb)"></span>Gingerbread CSV 받기</button>
      <button class="btn" id="csvMq"><span class="sw" style="background:var(--mq)"></span>Standard MQTT CSV 받기</button>
      <button class="btn danger" id="clear">기록 지우기</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section class="card">
    <details>
      <summary>보드가 보낸 원본 데이터</summary>
      <div class="tabs" id="ptabs"></div>
      <pre class="num" id="payload"></pre>
    </details>
  </section>

  <p class="mock">목업 화면입니다. 모든 값은 가짜 데이터로 만들어져요.</p>
</main>

<script>
(() => {
  "use strict";

  const MJ = 3600; // 1 mWh = 3600 mJ
  const INTERVALS = [1, 5, 10, 30, 60];
  const NODES = {
    gb: { name: "Gingerbread", color: "var(--gb)", fw: "gingerbread", seed: 22, temp: 21.8, gas: 110, e: [11 / 3600, 3 / 3600] },
    mq: { name: "Standard MQTT", color: "var(--mq)", fw: "standard", seed: 11, temp: 23.4, gas: 95, e: [38 / 3600, 8 / 3600] },
  };
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (v, d) => { const f = 10 ** d; return Math.round(v * f) / f; };
  const seeded = (seed) => { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); };

  /* ---------- 가짜 데이터 ---------- */
  class Sim {
    constructor(n) {
      this.n = n; this.r = seeded(n.seed); this.pr = seeded(n.seed * 10);
      this.temp = n.temp; this.hum = 45 + this.r() * 10; this.gas = n.gas;
      this.batt = 4.1; this.up = 0; this.id = 0; this.tel = []; this.pow = []; this.pc = 0;
      for (let i = 0; i < 40; i++) this.tick(Date.now() - (40 - i) * 2000);
      for (let i = 0; i < 60; i++) this.powTick(Date.now() - (60 - i) * 3000);
    }
    tick(ts = Date.now()) {
      const r = this.r, gb = this.n.fw === "gingerbread";
      this.id++; this.up += 2;
      this.temp += (r() - 0.5) * 0.3;
      this.hum = clamp(this.hum + (r() - 0.5) * 1.2, 30, 80);
      this.gas = clamp(this.gas + (r() - 0.52) * 4, 20, 180);
      this.batt = clamp(this.batt - 0.00004 + (r() - 0.5) * 0.0005, 3.3, 4.2);
      const s = { ts, temp: rnd(this.temp, 1), hum: rnd(this.hum, 0), gas: rnd(this.gas, 1), rssi: Math.round(-58 - r() * 22),
        batt: rnd(this.batt, 2), up: this.up, gasOk: r() > 0.03, awake: gb ? this.id % 5 === 0 : true };
      s.raw = JSON.stringify({ temp: s.temp, hum: s.hum, gas: s.gas, qos: 1, retry: 0, sleep_ratio: gb ? 0.82 : 0.11, ...(gb ? { nn: 0.42 } : { pkt: this.id }) }, null, 2);
      this.tel.push(s); if (this.tel.length > 40) this.tel.shift();
    }
    powTick(ts = Date.now()) {
      const [base, jit] = this.n.e, i = this.pc++, spike = i < 3;
      const raw = base + (this.pr() - 0.5) * jit * 2;
      this.pow.push({ ts, mwh: spike ? raw * (4 + this.pr() * 3) : Math.max(raw, base * 0.4), spike });
      if (this.pow.length > 60) this.pow.shift();
    }
  }
  const sim = { gb: new Sim(NODES.gb), mq: new Sim(NODES.mq) };
  const st = { conn: "connecting", hideSpike: true, interval: null, busy: false, ptab: "gb", cut: { gb: 0, mq: 0 } };

  /* ---------- 계산 ---------- */
  const power = (k) => sim[k].pow.filter((p) => p.ts >= st.cut[k] && !(st.hideSpike && p.spike));
  const summary = (k) => {
    const p = power(k); if (!p.length) return { avg: null, total: 0 };
    const total = p.reduce((a, x) => a + x.mwh, 0);
    return { avg: total / p.length, total };
  };
  const rel = (ts) => { const s = Math.round((Date.now() - ts) / 1000); return s < 5 ? "방금" : s < 60 ? `${s}초 전` : `${Math.round(s / 60)}분 전`; };
  const upTxt = (s) => (s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분` : `${Math.floor(s / 60)}분`);

  /* ---------- 그리기 ---------- */
  function lineChart(series) {
    const W = 640, H = 230, L = 52, R = 14, T = 12, B = 14;
    const all = series.flatMap((s) => s.v);
    if (!all.length) return `<div class="empty">데이터를 모으는 중이에요…</div>`;
    let min = Math.min(...all), max = Math.max(...all);
    const pad = (max - min) * 0.2 || max * 0.1 || 1;
    min = Math.max(0, min - pad); max += pad;
    const iw = W - L - R, ih = H - T - B;
    const x = (i, n) => L + (i / Math.max(n - 1, 1)) * iw;
    const y = (v) => T + (1 - (v - min) / (max - min)) * ih;
    let g = "";
    for (let k = 0; k < 4; k++) {
      const val = min + ((max - min) * k) / 3, yy = y(val);
      g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#e1e5ee"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="12" fill="#8a93a8" font-family="Outfit,sans-serif">${val.toFixed(0)}</text>`;
    }
    const lines = series.map((s) => {
      if (!s.v.length) return "";
      const pts = s.v.map((v, i) => `${x(i, s.v.length).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const lx = x(s.v.length - 1, s.v.length), ly = y(s.v[s.v.length - 1]);
      return `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`;
    }).join("");
    const legend = series.map((s) => `<span><i class="sw" style="background:${s.c}"></i>${s.name}${s.v.length ? ` <b>${s.v[s.v.length - 1].toFixed(1)} ${s.u}</b>` : ""}</span>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map((s) => s.name).join(" 대 ")} 비교 꺾은선 그래프">${g}${lines}</svg><div class="legend">${legend}</div>`;
  }

  function renderHero() {
    const gb = summary("gb"), mq = summary("mq");
    const diff = gb.avg !== null && mq.avg ? ((mq.avg - gb.avg) / mq.avg) * 100 : null;
    $("saving").innerHTML = diff === null
      ? `<div class="big">–</div><div class="cap">계산 중</div>`
      : `<div class="big">${Math.abs(diff).toFixed(0)}<small>%</small></div><div class="cap">${diff >= 0 ? "에너지를 덜 써요" : "에너지를 더 써요"}</div><div class="sub">Gingerbread가 Standard MQTT보다 (통신 1회 기준)</div>`;
    const maxAvg = Math.max(gb.avg || 0, mq.avg || 0, Number.EPSILON);
    const row = (k, s) => `<div><div class="top"><span class="nm"><i class="sw" style="background:${NODES[k].color}"></i>${NODES[k].name}</span>
      <span class="val">${s.avg === null ? "–" : (s.avg * MJ).toFixed(1)}<small>mJ / 1회</small></span></div>
      <div class="track"><div class="fill" style="width:${s.avg === null ? 0 : Math.max((s.avg / maxAvg) * 100, 3)}%;background:${NODES[k].color}"></div></div>
      <div class="tot">지금까지 모두 ${s.total.toFixed(3)} mWh</div></div>`;
    $("race").innerHTML = row("gb", gb) + row("mq", mq);
  }

  function renderTrend() {
    $("trend").innerHTML = lineChart([
      { name: "Standard MQTT", c: "#3d4fd1", u: "mJ", v: power("mq").map((p) => p.mwh * MJ) },
      { name: "Gingerbread", c: "#e08a00", u: "mJ", v: power("gb").map((p) => p.mwh * MJ) },
    ]);
  }

  function renderDevices() {
    $("devices").innerHTML = ["gb", "mq"].map((k) => {
      const t = sim[k].tel, s = t[t.length - 1], awake = s.awake;
      return `<div class="dev" style="border-top-color:${NODES[k].color}">
        <div class="row1"><span class="nm">${NODES[k].name}</span><span class="pill ${awake ? "ok" : ""}"><i></i>${awake ? "데이터 보내는 중" : "잠자는 중"}</span></div>
        <div class="reads">
          <div class="read"><div class="k">온도</div><div class="v">${s.temp.toFixed(1)}<small>°C</small></div></div>
          <div class="read"><div class="k">습도</div><div class="v">${s.hum}<small>%</small></div></div>
          <div class="read"><div class="k">가스저항</div><div class="v">${s.gas.toFixed(0)}<small>kΩ</small></div></div>
        </div>
        <div class="more"><span>신호 ${s.rssi} dBm</span><span>배터리 ${s.batt.toFixed(2)} V</span><span>켜진 지 ${upTxt(s.up)}</span><span>${rel(s.ts)} 갱신</span>${s.gasOk ? "" : `<span class="flag">가스 값 확인 필요</span>`}</div>
      </div>`;
    }).join("");
  }

  function renderStatus() {
    const c = $("conn"); c.className = "pill" + (st.conn === "connected" ? " ok" : "");
    c.lastChild.textContent = st.conn === "connected" ? "서버 연결됨" : "연결하는 중";
    const anyAwake = sim.gb.tel.at(-1).awake || sim.mq.tel.at(-1).awake;
    const e = $("exp"); e.className = "pill" + (anyAwake ? " ok" : "");
    e.lastChild.textContent = anyAwake ? "실험 진행 중" : "실험 대기 중";
  }

  function renderPayload() {
    $("ptabs").innerHTML = ["gb", "mq"].map((k) => `<button data-k="${k}" aria-pressed="${st.ptab === k}"><i class="sw" style="background:${NODES[k].color}"></i>${NODES[k].name}</button>`).join("");
    $("payload").textContent = sim[st.ptab].tel.at(-1).raw;
  }

  function renderIntervals() {
    $("intervals").innerHTML = INTERVALS.map((s) => `<button data-s="${s}" aria-pressed="${st.interval === s}" ${st.busy ? "disabled" : ""}>${s}초</button>`).join("");
  }

  const say = (t) => { $("msg").textContent = t; };
  function renderAll() { renderStatus(); renderHero(); renderTrend(); renderDevices(); renderPayload(); }

  /* ---------- 이벤트 ---------- */
  $("spike").addEventListener("click", () => {
    st.hideSpike = !st.hideSpike;
    $("spike").setAttribute("aria-checked", String(st.hideSpike));
    renderHero(); renderTrend();
  });
  $("ptabs").addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) { st.ptab = b.dataset.k; renderPayload(); } });
  $("intervals").addEventListener("click", (e) => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    const s = Number(b.dataset.s); st.busy = true; say("보드에 전달하는 중…"); renderIntervals();
    setTimeout(() => { st.busy = false; st.interval = s; say(`전송 주기를 ${s}초로 바꿨어요.`); renderIntervals(); }, 600);
  });
  $("clear").addEventListener("click", () => {
    if (!window.confirm("기록을 모두 지울까요? 지운 기록은 되돌릴 수 없어요.")) return;
    const now = Date.now(); st.cut.gb = now; st.cut.mq = now;
    say("기록을 지웠어요. 새 데이터를 다시 모으는 중이에요."); renderHero(); renderTrend();
  });
  const csv = (k) => {
    const rows = sim[k].tel.map((s) => [new Date(s.ts).toISOString(), s.temp, s.hum, s.gas, s.gasOk, s.rssi, s.batt].join(","));
    const text = "시각,온도,습도,가스저항,가스정상,신호,배터리\n" + rows.join("\n");
    const url = URL.createObjectURL(new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a"); a.href = url; a.download = `${NODES[k].fw}-data.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    say(`${NODES[k].name} CSV를 내려받았어요.`);
  };
  $("csvGb").addEventListener("click", () => csv("gb"));
  $("csvMq").addEventListener("click", () => csv("mq"));

  /* ---------- 시작 ---------- */
  renderIntervals(); renderAll();
  setTimeout(() => { st.conn = "connected"; renderStatus(); }, 400);
  setInterval(() => { sim.gb.tick(); sim.mq.tick(); renderStatus(); renderDevices(); renderPayload(); }, 2000);
  setInterval(() => { sim.gb.powTick(); sim.mq.powTick(); renderHero(); renderTrend(); }, 3000);
})();
</script>
</body>
</html>
