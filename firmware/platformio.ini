; ═══════════════════════════════════════════════════════════════════════════
; firmware/platformio.ini
; ───────────────────────────────────────────────────────────────────────────
; 프로젝트 : Gingerbread 멀티-환경 빌드 시스템
; 대상 MCU : ESP32-S3 DevKitC-1 (모든 보드 공통)
;
; [env:board1_gingerbread] → Board 1 : 제안 시스템 (TinyML AI QoS + SW 전력 추정)
; [env:board2_standard]    → Board 2 : 베이스라인 시스템 (고정 QoS 1 MQTT + SW 전력 추정)
; [env:board3_monitor]     → Board 3 : [DEPRECATED] INA219 하드웨어 전력 계측
;                                      소프트웨어 정의 전력 추정으로 대체됨
;                                      (IEEE Access 2024, DOI:10.1109/ACCESS.2024.3523864)
;                                      이 환경은 빌드 대상에서 제외됩니다.
;
; build_src_filter 지시어를 사용하여 각 환경이 지정된 단일 소스 파일만 컴파일합니다.
; 나머지 src/ 파일은 해당 환경의 빌드에서 자동으로 제외됩니다.
; ═══════════════════════════════════════════════════════════════════════════

; ── 모든 환경에 공통 적용되는 기준 설정 ──────────────────────────────────
[env]
platform       = espressif32
board          = esp32-s3-devkitc-1
framework      = arduino
monitor_speed  = 115200

; ── 공통 외부 라이브러리 의존성 ──────────────────────────────────────────
; ArduinoJson          : MQTT 페이로드 및 설정 JSON 파싱 (Board 1, 2)
; PubSubClient         : 표준 MQTT 브로커 통신 (Board 1 설정 구독, Board 2 전송)
; Adafruit BME680      : 온도/습도/가스 환경 센서 드라이버 (Board 1)
;
; ※ Adafruit INA219 의존성 제거 (2026-06)
;   Board 3 하드웨어 전력 계측이 소프트웨어 추정(gateway 측)으로 대체됨
lib_deps =
    bblanchon/ArduinoJson             @ ^7.0
    knolleary/PubSubClient            @ ^2.8
    adafruit/Adafruit BME680 Library  @ ^2.0

; ── 공통 빌드 플래그 ─────────────────────────────────────────────────────
; ArduinoJson 중첩 한도: gingerbread/config JSON 3단계 구조 파싱에 충분합니다.
build_flags =
    -D ARDUINOJSON_DEFAULT_NESTING_LIMIT=10

; ═══════════════════════════════════════════════════════════════════════════
; Board 1 : 제안 시스템 — Gingerbread AI QoS 엣지 노드
; ───────────────────────────────────────────────────────────────────────────
; 역할 : MQTT 설정 구독 + FreeRTOS Mutex 동적 임계값 + AI QoS 추론 + UDP 전송
; 클라이언트 ID : "ESP32-Gingerbread"
; ═══════════════════════════════════════════════════════════════════════════
[env:board1_gingerbread]
; build_src_filter: src/ 디렉터리 기본값(-<*>)을 제거 후 지정 파일만 포함합니다.
; include/ 디렉터리는 자동으로 포함되므로 protocol.h 헤더가 정상 인식됩니다.
build_src_filter = -<*> +<main_gingerbread.cpp>

; ═══════════════════════════════════════════════════════════════════════════
; Board 2 : 베이스라인 시스템 — Standard MQTT 벤치마크 노드
; ───────────────────────────────────────────────────────────────────────────
; 역할 : 고정 QoS 1, 5초 주기, 모의 온도/습도 데이터 전송
; 클라이언트 ID : "ESP32-Standard-MQTT"
; ═══════════════════════════════════════════════════════════════════════════
[env:board2_standard]
build_src_filter = -<*> +<main_standard_MQTT.cpp>

; ═══════════════════════════════════════════════════════════════════════════
; Board 3 : [DEPRECATED — 소프트웨어 추정으로 대체됨]
; ───────────────────────────────────────────────────────────────────────────
; 원 역할 : INA219 #1(0x40) + #2(0x41) 이중 채널 하드웨어 전력 계측
; 대체 방식: IEEE Access 2024 기반 소프트웨어 정의 전력 추정
;            (backend/app/services/power_estimator.py)
;
; 이 환경은 빌드에서 제외됩니다. main_monitor.cpp는 참조용으로 보존됩니다.
; 소스를 완전히 삭제하려면 main_monitor.cpp를 수동으로 제거하세요.
; ═══════════════════════════════════════════════════════════════════════════
[env:board3_monitor]
; DEPRECATED: Board 3는 더 이상 배포되지 않습니다.
; 빌드 시 이 환경은 지정하지 마세요 (pio run -e board3_monitor 사용 금지).
; 하위 호환성을 위해 환경 선언은 보존하되 빈 필터로 아무것도 빌드하지 않습니다.
build_src_filter = -<*>