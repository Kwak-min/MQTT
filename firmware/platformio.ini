[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ── 외부 라이브러리 의존성 ────────────────────────────────────────────────
; PubSubClient : MQTT 브로커 통신 (gingerbread/config 설정 구독)
; ArduinoJson  : MQTT 페이로드 JSON 파싱 (SystemConfig 동적 갱신)
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson  @ ^7.0

; ArduinoJson 정적 도큐먼트 최대 크기 (bytes)
; config.json 전체 구조를 파싱하기 충분한 512바이트로 설정합니다.
build_flags =
    -D ARDUINOJSON_DEFAULT_NESTING_LIMIT=10