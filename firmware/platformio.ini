; ═══════════════════════════════════════════════════════════════════════════
; firmware/platformio.ini
; ───────────────────────────────────────────────────────────────────────────
; 프로젝트 : Gingerbread 멀티-환경 빌드 시스템
; 대상 MCU : ESP32-S3 DevKitC-1 (모든 보드 공통)
;
; [env:board1_gingerbread] → Board 1 : 제안 시스템 (AI QoS + 동적 설정)
; [env:board2_standard]    → Board 2 : 베이스라인 시스템 (고정 QoS 1 MQTT)
; [env:board3_monitor]     → Board 3 : 전력 계측 서비스 (INA219 이중 채널)
;
; build_src_filter 지시어를 사용하여 각 환경이 지정된 단일 소스 파일만 컴파일합니다.
; 나머지 src/ 파일은 해당 환경의 빌드에서 자동으로 제외됩니다.
; ═══════════════════════════════════════════════════════════════════════════

; ── 모든 환경에 공통 적용되는 기준 설정 ──────────────────────────────────
[env]
platform       = espressif32
board          = esp32-s3-devkitc-1
framework      = arduino
monitor_speed  = 115200

; ── 공통 외부 라이브러리 의존성 ──────────────────────────────────────────
; ArduinoJson   : MQTT 페이로드 및 설정 JSON 파싱 (Board 1, 2)
; PubSubClient  : 표준 MQTT 브로커 통신 (Board 1 설정 구독, Board 2 전송)
; Adafruit INA219       : INA219 전류/전력 센서 드라이버 (Board 3)
; Adafruit BME680 Library : 온도/습도/가스 환경 센서 드라이버 (Board 1)
lib_deps =
    bblanchon/ArduinoJson             @ ^7.0
    knolleary/PubSubClient            @ ^2.8
    adafruit/Adafruit INA219          @ ^1.2
    adafruit/Adafruit BME680 Library  @ ^2.0

; ── 공통 빌드 플래그 ─────────────────────────────────────────────────────
; ArduinoJson 중첩 한도: gingerbread/config JSON 3단계 구조 파싱에 충분합니다.
build_flags =
    -D ARDUINOJSON_DEFAULT_NESTING_LIMIT=10

; ═══════════════════════════════════════════════════════════════════════════
; Board 1 : 제안 시스템 — Gingerbread AI QoS 엣지 노드
; ───────────────────────────────────────────────────────────────────────────
; 역할 : MQTT 설정 구독 + FreeRTOS Mutex 동적 임계값 + AI QoS 추론 + UDP 전송
; 클라이언트 ID : "ESP32-Gingerbread"
; ═══════════════════════════════════════════════════════════════════════════
[env:board1_gingerbread]
; build_src_filter: src/ 디렉터리 기본값(-<*>)을 제거 후 지정 파일만 포함합니다.
; include/ 디렉터리는 자동으로 포함되므로 protocol.h 헤더가 정상 인식됩니다.
build_src_filter = -<*> +<main_gingerbread.cpp>

; ═══════════════════════════════════════════════════════════════════════════
; Board 2 : 베이스라인 시스템 — Standard MQTT 벤치마크 노드
; ───────────────────────────────────────────────────────────────────────────
; 역할 : 고정 QoS 1, 5초 주기, 모의 온도/습도 데이터 전송
; 클라이언트 ID : "ESP32-Standard-MQTT"
; ═══════════════════════════════════════════════════════════════════════════
[env:board2_standard]
build_src_filter = -<*> +<main_standard_MQTT.cpp>

; ═══════════════════════════════════════════════════════════════════════════
; Board 3 : 전력 계측 서비스 — INA219 이중 채널 전력 모니터
; ───────────────────────────────────────────────────────────────────────────
; 역할 : INA219 #1(0x40, Board 1 계측) + #2(0x41, Board 2 계측) 동시 샘플링
;        WiFiUDP를 통해 게이트웨이로 비동기 스트리밍
; 클라이언트 ID : "ESP32-Power-Monitor"
; ═══════════════════════════════════════════════════════════════════════════
[env:board3_monitor]
build_src_filter = -<*> +<main_monitor.cpp>